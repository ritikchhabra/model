# YOLOP BDD100K Config

# Dataset Path
DATASET_DIR: "dataset/bdd100k"

# Model Parameters
NUM_CLASSES_DET: 10  # To be updated after inspection
NUM_CLASSES_SEG: 19  # To be updated after inspection
NUM_LANES: 4         # To be updated after inspection

# Input Size
IMG_H: 384
IMG_W: 640

# Training Parameters
BATCH_SIZE: 16
EPOCHS: 30
LEARNING_RATE: 0.01
WEIGHT_DECAY: 0.0005
NUM_WORKERS: 4
VAL_SUBSET_SIZE: null  # Use full val set if null

# Checkpoint and Logging
KEEP_LAST_N: 3
CHECKPOINT_DIR: "checkpoints"
BEST_MODEL_PATH: "best.pt"
LAST_MODEL_PATH: "last.pt"

# Loss Weights
LAMBDA_DET: 1.0
LAMBDA_DRV: 1.0
LAMBDA_LANE: 1.0
